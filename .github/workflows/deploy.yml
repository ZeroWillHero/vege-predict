name: Deploy Backend

# Data collection, model training, and Postgres seeding all now run on a
# separate Windows machine's own cron job (which calls scrapers/train_all.py/
# predict_future.py and app/backend/seed.py directly against this EC2 box's
# Postgres). This workflow no longer touches any of that — it ONLY
# builds/restarts the Docker stack (api/postgres/redis/nginx) so the REST
# API is up and serving whatever Postgres already has. No training, no
# seeding, no detached/polling steps — deploy/deploy.sh finishes in a couple
# of minutes, so this runs as a normal foreground SSH step.
#
# Runs on a GitHub-hosted runner, which has no access to data/raw/
# (gitignored, lives only on the Windows training machine). It syncs the
# repo's tracked files to EC2 over SSH, then runs deploy/deploy.sh on the
# instance itself. `git archive | ssh ... tar -x` only writes the archive's
# own entries, so gitignored dirs (data/raw/, trained_models/, results/,
# .venv/) on the box are left untouched by the sync.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vegepredict-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ConnectTimeout 15
          EOF

      - name: Sync tracked repo files to EC2
        run: |
          git archive --format=tar HEAD | ssh deploy-target 'tar -x -C ~/Research-Project'

      - name: Deploy backend stack
        run: |
          ssh deploy-target "
            set -euo pipefail
            cd ~/Research-Project
            chmod +x deploy/*.sh
            SKIP_GIT_PULL=1 API_IMAGE='vegepredict-api:${{ github.sha }}' deploy/deploy.sh
          "
