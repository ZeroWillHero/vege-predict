name: Deploy Backend

# Data collection, model training, and Postgres seeding all now run on a
# separate Windows machine's own cron job (which calls scrapers/train_all.py/
# predict_future.py and app/backend/seed.py directly against this EC2 box's
# Postgres). This workflow only builds the API image and deploys it — no
# training, no seeding.
#
# Two jobs:
#   1. build-and-push: builds app/backend/Dockerfile on the GitHub-hosted
#      runner and pushes it to GHCR (ghcr.io), authenticated with the
#      workflow's own GITHUB_TOKEN — no Docker Hub account or extra secrets
#      needed. This is also what fixes the earlier "docker: command not
#      found" / full-repo-sync problems: the image is no longer built ON
#      the EC2 box at all.
#   2. deploy: syncs only what the server actually needs to run (not build)
#      the stack — docker-compose.yml and deploy/ — then runs
#      deploy/pull-and-deploy.sh on the instance, which pulls the
#      just-pushed image from GHCR and does `docker compose up -d`.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vegepredict-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zerowillhero/vege-predict-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Default runner setup uses the plain "docker" driver, which can't do
        # cache export (`cache-to: type=gha` below) — this switches to the
        # docker-container driver that supports it.

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ConnectTimeout 15
          EOF

      - name: Ensure deploy directory exists
        run: |
          ssh deploy-target "mkdir -p ~/Research-Project"

      - name: Sync only what's needed to run (not build) the stack
        run: |
          # Just docker-compose.yml and deploy/ (scripts + nginx config) —
          # NOT the full source tree. Migrations run via `docker compose exec`
          # against the api container, which already has app/backend/
          # (including alembic/) baked in from the build-and-push job, so the
          # host doesn't need those files at all.
          git archive --format=tar HEAD docker-compose.yml deploy \
            | ssh deploy-target 'tar -x -C ~/Research-Project'

      - name: Pull and deploy
        run: |
          ssh deploy-target "bash -lc '
            set -euo pipefail
            cd ~/Research-Project
            chmod +x deploy/*.sh
            export API_IMAGE=\"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\"
            export GHCR_TOKEN=\"${{ secrets.GITHUB_TOKEN }}\"
            export GHCR_USER=\"${{ github.actor }}\"
            deploy/pull-and-deploy.sh
          '"
