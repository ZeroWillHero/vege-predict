events {}

http {
    upstream vegepredict_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Reserved for certbot's HTTP-01 challenge once a domain is pointed here.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://vegepredict_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Once you have a domain + cert (see deploy/enable-tls.sh), uncomment and
    # point this at the same upstream, then drop the "location /" block above
    # in favor of a 301 redirect to https.
