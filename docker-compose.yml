services:
  postgres:
    image: postgres:15.17-trixie
    container_name: vegepredict-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg123
      POSTGRES_DB: vegepredict
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vegepredict"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vegepredict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Prod/CI path pulls a pre-built image from GHCR (see .github/workflows/deploy.yml
    # and deploy/pull-and-deploy.sh) — set API_IMAGE to override, e.g. a specific
    # commit SHA tag. `build:` is kept only for local dev (`docker compose build`).
    image: ${API_IMAGE:-ghcr.io/zerowillhero/vege-predict-api:latest}
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: vegepredict-api
    environment:
      VEGEPREDICT_DATABASE_URL: postgresql+asyncpg://postgres:pg123@postgres:5432/vegepredict
      VEGEPREDICT_REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: vegepredict-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  certbot_www:
    name: vegepredict_certbot_www
  certbot_certs:
    name: vegepredict_certbot_certs
